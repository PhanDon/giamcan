<!DOCTYPE html>
<html lang="vi" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD6E7" id="metaTheme">
<title>Giữ Lửa – Chuỗi ngày tập thể dục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GIỮ LỬA — design tokens
   Ngày: hồng kẹo + viền mận (kiểu sticker)   Đêm: đen sâu + neon hồng
   ========================================================= */
:root{
  --bg:#FFD6E7; --card:#FFF7FB; --card2:#FFE9F3; --ink:#4A0F36; --ink2:#8B4A70; --line:#4A0F36;
  --pop:#FF2E8A; --pop2:#FF86BE; --sun:#FFD23F; --mint:#2FD8A8; --lilac:#A97BFF; --sky:#38C7FF; --orange:#FF8A1F;
  --sh:#FF2E8A; --glow:rgba(255,46,138,0); --dot:rgba(255,46,138,.16);
  --blob1:rgba(255,120,185,.65); --blob2:rgba(169,123,255,.45); --blob3:rgba(255,210,63,.42);
  --warn:#FFE48A; --warnInk:#5a3b00; --onpop:#fff;
  --fh:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme=night],html[data-cine]{
  --bg:#06020A; --card:#12081A; --card2:#1C0E28; --ink:#FFEAF5; --ink2:#C79AB9; --line:#FF4FA3;
  --pop:#FF3D9A; --pop2:#FF86BE; --sh:#6A0E43; --glow:rgba(255,61,154,.38); --dot:rgba(255,79,163,.09);
  --blob1:rgba(255,40,140,.22); --blob2:rgba(120,60,255,.20); --blob3:rgba(255,150,40,.10);
  --warn:#3a2a05; --warnInk:#FFD98A; --onpop:#fff;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:29;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(10px)}
html{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-text-size-adjust:100%;transition:background-color .6s}
body{margin:0;min-height:100vh;background:transparent;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(60vmax 42vmax at 8% -4%,var(--blob1),transparent 62%),
   radial-gradient(52vmax 40vmax at 104% 18%,var(--blob2),transparent 62%),
   radial-gradient(56vmax 40vmax at 38% 108%,var(--blob3),transparent 62%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.8px);background-size:24px 24px}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3,h4{font-family:var(--fh);font-weight:800;line-height:1.15;margin:0;overflow-wrap:anywhere}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px clamp(14px,4vw,32px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(10px);
  border-bottom:2.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand .flame-wrap{--fs:34px;animation:none}
.brand-name{font:800 28px/1 var(--fh);letter-spacing:.2px;background:linear-gradient(90deg,var(--pop),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-right{display:flex;align-items:center;gap:12px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 var(--sh)}
.icon-btn b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--pop);color:var(--onpop);font:700 12px/20px var(--fb);text-align:center;padding:0 5px;border:2px solid var(--line)}
.theme{position:relative;width:78px;height:44px;border-radius:99px;border:2.5px solid var(--line);background:linear-gradient(90deg,#FFE9A8,#FFB6D5);box-shadow:0 3px 0 var(--sh);padding:0;font-size:18px;display:flex;align-items:center;justify-content:space-between;padding:0 9px}
html[data-theme=night] .theme{background:linear-gradient(90deg,#2a1240,#0b0412)}
.theme .knob{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:#fff;border:2.5px solid var(--line);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
html[data-theme=night] .theme .knob{transform:translateX(34px);background:#FFE9F5}
.theme span{position:relative;z-index:1;line-height:1}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px clamp(14px,4vw,32px) 80px}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:26px;box-shadow:5px 5px 0 var(--sh),0 0 34px var(--glow);padding:20px}
.card.tight{padding:14px}
.card h3{font-size:22px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:grid;gap:22px}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--ink2)}
.small{font-size:13.5px}

/* user chips + tabs */
.urow{display:flex;gap:10px;overflow-x:auto;padding:6px 3px 14px;scrollbar-width:thin}
.hd{flex:none;width:var(--hs,38px);height:var(--hs,38px);border-radius:50%;overflow:hidden;background:var(--card2);border:2px solid var(--line);display:grid;place-items:center}
.hd svg{width:100%;height:100%;display:block}
.uchip .un{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .hd{--hs:28px}.fi .hd{--hs:44px}.chk .hd{--hs:34px}
.uchip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 16px 5px 6px;border-radius:99px;border:2.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.uchip.on{background:var(--pop);color:var(--onpop);box-shadow:3px 3px 0 var(--sh)}
.uchip.add{border-style:dashed;padding:5px 16px;color:var(--pop)}
.uchip.add.on{color:var(--onpop)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 16px}
.tab{flex:none;padding:10px 18px;border-radius:99px;border:2.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;position:relative}
.tab[aria-selected=true]{background:var(--sun);color:#4A0F36;box-shadow:3px 3px 0 var(--sh)}
html[data-theme=night] .tab[aria-selected=true]{background:var(--pop);color:var(--onpop)}
.tab em{font-style:normal;margin-left:6px;background:var(--pop);color:var(--onpop);border-radius:99px;padding:1px 8px;font-size:12px}

/* buttons */
.btn{font-family:var(--fh);font-weight:800;font-size:19px;padding:12px 26px;border-radius:99px;border:3px solid var(--line);background:var(--pop);color:var(--onpop);box-shadow:0 5px 0 var(--sh);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sh)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn.sec{background:var(--card);color:var(--ink)}
.btn.sun{background:var(--sun);color:#4A0F36}
.btn.sm{font-size:15px;padding:7px 14px;box-shadow:0 3px 0 var(--sh);border-width:2.5px}
.btn.sm:hover{box-shadow:0 5px 0 var(--sh)}
.btn.done{background:var(--mint);color:#08392c;cursor:default}
.btn.done:hover,.btn.done:active{transform:none;box-shadow:0 5px 0 var(--sh)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important}
.btn.big{font-size:22px;padding:16px 34px}
.link{background:none;border:0;padding:4px;text-decoration:underline;text-underline-offset:3px;font-weight:600;color:var(--ink2)}
.chip{padding:7px 16px;border-radius:99px;border:2.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--pop);color:var(--onpop);box-shadow:2px 2px 0 var(--sh)}

/* ---------- FLAME ---------- */
.flame-wrap{position:relative;display:inline-block;width:var(--fs,160px);aspect-ratio:100/130;
  filter:drop-shadow(0 0 calc(var(--fs,160px)*.16) var(--glow))}
.flame-wrap svg{width:100%;height:100%;overflow:visible;display:block}
.fl{transform-box:fill-box;transform-origin:50% 100%}
.fl1{fill:var(--f1);animation:fk1 1.9s ease-in-out infinite}
.fl2{fill:var(--f2);animation:fk2 1.35s ease-in-out infinite}
.fl3{fill:var(--f3);animation:fk3 .95s ease-in-out infinite}
@keyframes fk1{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.965,1.05) skewX(2.5deg)}65%{transform:scale(1.03,.97) skewX(-2.5deg)}}
@keyframes fk2{0%,100%{transform:scale(1,1) skewX(0)}40%{transform:scale(1.04,.95) skewX(-3deg)}75%{transform:scale(.95,1.06) skewX(3deg)}}
@keyframes fk3{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.12)}}
.flame-wrap.ember .fl{animation-duration:4s}
.flame-wrap.ember{filter:none}
.flame-wrap.rainbow svg{animation:hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fnum{position:absolute;left:0;right:0;top:56%;transform:translateY(-50%);text-align:center;font-family:var(--fh);font-weight:800;
  font-size:calc(var(--fs,160px)*.36);line-height:1;color:#fff;text-shadow:0 calc(var(--fs,160px)*.012) 0 rgba(60,0,40,.35),0 0 calc(var(--fs,160px)*.06) rgba(60,0,40,.4)}
.flame-wrap.d3 .fnum{font-size:calc(var(--fs,160px)*.27)}
.flame-wrap.d4 .fnum{font-size:calc(var(--fs,160px)*.21)}
.flame-wrap.ember .fnum{color:#e9e2ee}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;bottom:45%;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;background:var(--f3);opacity:0;
  box-shadow:0 0 8px var(--f2);animation:rise 2.6s var(--dl) infinite ease-out}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--fs,160px)*-.8)) scale(.2)}}
.mini{width:62%;height:auto;margin-top:6px;overflow:visible}
.mini path{animation:none}

/* ---------- CHIBI ---------- */
.chibi{width:var(--cw,120px);height:auto;overflow:visible;display:block}
.chibi .c-hair{fill:var(--hair)} .chibi .c-shirt{fill:var(--shirt)} .chibi .c-pants{fill:var(--pants)}
.chibi .ol{stroke:#2a0a20;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
.chibi .body{transform-origin:60px 158px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.chibi .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.chibi .arm-l{transform-origin:45px 99px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.chibi .arm-r{transform-origin:75px 99px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.chibi .leg-l{transform-origin:52px 126px} .chibi .leg-r{transform-origin:68px 126px}
.chibi .mo{display:none}
.chibi.head .body{animation:none}
.chibi.run .body{animation:runbob .34s ease-in-out infinite}
@keyframes runbob{50%{transform:translateY(-7px)}}
.chibi.run .leg-l{animation:legs .34s ease-in-out infinite}
.chibi.run .leg-r{animation:legs .34s ease-in-out infinite reverse}
@keyframes legs{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}
.chibi.run .arm-l{animation:armsw .34s ease-in-out infinite reverse}
.chibi.run .arm-r{animation:armsw .34s ease-in-out infinite}
@keyframes armsw{0%,100%{transform:rotate(-45deg)}50%{transform:rotate(45deg)}}
.chibi.cast .arm-l,.chibi.jump .arm-l{transform:rotate(152deg)}
.chibi.cast .arm-r,.chibi.jump .arm-r{transform:rotate(-152deg)}
.chibi.cast .body{animation:castpulse 1s ease-in-out infinite}
@keyframes castpulse{50%{transform:translateY(-4px) scale(1.02)}}
.chibi.jump .body{animation:jump .75s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
.chibi.cast .m,.chibi.jump .m{display:none}
.chibi.cast .mo,.chibi.jump .mo{display:block}
.nametag{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:var(--sun);color:#4A0F36;border:2px solid var(--line);font:800 14px var(--fh)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;text-align:center;padding:22px 20px 26px;
  background:radial-gradient(70% 60% at 50% 38%,var(--glow),transparent 70%),var(--card)}
.hero-date{font:800 clamp(22px,4.4vw,30px)/1.1 var(--fh)}
.hero-sub{margin-top:4px}
.hero-stage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,3vw,26px);flex-wrap:wrap;margin:14px 0 6px;position:relative}
.hero-stage .flame-wrap{--fs:min(210px,52vw)!important}
.hero-chibi{padding-bottom:4px}
.hero-chibi .chibi{--cw:min(128px,30vw)}
.tier-name{font:800 22px var(--fh);margin-top:4px}
.progress{max-width:420px;margin:12px auto 4px}
.bar{height:18px;border-radius:99px;border:2.5px solid var(--line);background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,var(--f1),var(--f2));border-radius:99px;transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.banner{margin:16px auto 0;max-width:520px;padding:12px 16px;border-radius:18px;border:2.5px dashed var(--line);background:var(--card2);font-weight:500}
.banner.warn{background:var(--warn);color:var(--warnInk)}
.banner.ok{background:color-mix(in srgb,var(--mint) 35%,var(--card))}
.hero .btn.big{margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:18px;background:var(--card2);border:2px solid var(--line)}
.stat b{display:block;font:800 26px/1.1 var(--fh)}
.stat span{font-size:13.5px;color:var(--ink2)}
.stat.wide{grid-column:span 2}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h4{font-size:19px}
.cal-nav{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);font-weight:800;font-size:18px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-w{text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0;font-size:12px}
.cd .dn{position:absolute;top:2px;left:5px;font-size:10.5px;font-weight:700;opacity:.65}
.cd.on{border-color:var(--line)}
.cd.today{outline:3px solid var(--sun);outline-offset:1px}
.cd.out{visibility:hidden}
.cd.fut{opacity:.45}
.cal-detail{margin-top:10px;min-height:44px;padding:10px 14px;border-radius:14px;background:var(--card2);border:2px dashed var(--line);font-size:14.5px}

/* ladder */
.ladder{display:grid;gap:8px}
.mile{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card2)}
.mile .flame-wrap{--fs:34px;flex:none}
.mile.lock{opacity:.6}
.mile.lock .flame-wrap{filter:grayscale(1)}
.mile b{font-family:var(--fh);font-size:18px}
.mile small{display:block;color:var(--ink2)}
.log{display:grid;gap:6px}
.log div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card2);font-size:14.5px}

/* friends */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.fcard{position:relative;display:grid;gap:10px;padding-top:26px}
.rank{position:absolute;top:-14px;left:16px;padding:2px 14px;border-radius:99px;background:var(--sun);color:#4A0F36;border:2.5px solid var(--line);font:800 17px var(--fh)}
.fcard .top2{display:flex;align-items:center;gap:12px}
.fcard .top2 .chibi{--cw:64px}
.fcard h4{font-size:20px}
.status{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;border:2px solid var(--line)}
.status.ok{background:color-mix(in srgb,var(--mint) 55%,var(--card))}
.status.wait{background:var(--warn);color:var(--warnInk)}
.status.off{background:var(--card2);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:44px 22px;text-align:center}
.empty .flame-wrap{--fs:150px}

/* squads */
.sq{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.sq .flame-wrap{--fs:130px}
@media(max-width:560px){.sq{grid-template-columns:1fr;justify-items:center;text-align:center}}
.members{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.mem{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-size:14px;font-weight:700}
.mem.ok{background:color-mix(in srgb,var(--mint) 45%,var(--card))}

/* exercises */
.days{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:20px;background:var(--card2);border:2.5px solid var(--line)}
.ex .em{font-size:34px;line-height:1;width:54px;height:54px;border-radius:16px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.ex h4{font-size:18px}
.ex .reps{display:inline-block;margin:4px 0;padding:1px 10px;border-radius:99px;background:var(--pop);color:var(--onpop);font-weight:700;font-size:13px}
.ex p{margin:0;font-size:14px;color:var(--ink2)}
.tipbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tipbar span{padding:6px 14px;border-radius:99px;background:var(--card2);border:2px dashed var(--line);font-size:14px}

/* feed */
.feed{display:grid;gap:10px}
.fi{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:var(--card2)}
.fi.new{background:color-mix(in srgb,var(--pop) 20%,var(--card));border-width:3px}
.fi small{display:block;color:var(--ink2)}

/* welcome + tools */
.welcome{text-align:center;max-width:640px;margin:20px auto}
.welcome h1{font-size:clamp(34px,7vw,54px);margin:10px 0}
.welcome .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
details.tools{margin-top:30px;border-radius:20px;border:2.5px dashed var(--line);padding:12px 18px;background:color-mix(in srgb,var(--card) 70%,transparent)}
details.tools summary{cursor:pointer;font-weight:700}
.tools .acts{margin-top:12px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(40,0,28,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto;opacity:0;transition:opacity .25s}
.modal.on{opacity:1}
.sheet{width:min(560px,100%);max-height:94vh;overflow:auto;background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:7px 7px 0 var(--sh),0 0 40px var(--glow);padding:22px;transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.modal.on .sheet{transform:none}
.sheet h3{font-size:26px;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.lbl{font-weight:700;font-size:14.5px}
.field input[type=text],.field textarea{padding:11px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--card2)}
.field textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.editor{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:12px}
@media(max-width:480px){.editor{grid-template-columns:1fr;justify-items:center}}
.prevbox{display:grid;place-items:center;text-align:center;padding:14px 18px;border-radius:22px;background:linear-gradient(160deg,var(--card2),var(--card));border:2.5px dashed var(--line);min-width:170px}
.swrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.swrow .lbl{width:46px}
.sw{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);background:var(--c);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pop)}
input[type=color]{width:34px;height:30px;border:2.5px solid var(--line);border-radius:10px;padding:0;background:none}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card2);margin-bottom:8px;font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--pop)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{padding:12px 18px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;border:2.5px solid var(--pop);box-shadow:0 6px 24px rgba(0,0,0,.3);animation:tin .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.95)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:10000;pointer-events:none}

/* ---------- celebration ---------- */
.celeb{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:radial-gradient(60% 60% at 50% 40%,rgba(255,46,138,.35),rgba(20,0,16,.88));opacity:0;transition:opacity .35s}
.celeb.on{opacity:1}
.celeb .box{width:min(520px,100%);text-align:center;color:#FFEAF5;padding:10px}
.celeb .flame-wrap{--fs:min(230px,48vw)!important;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-12deg)}}
.celeb h2{font-size:clamp(32px,8vw,48px);margin:10px 0 6px;text-shadow:0 0 24px var(--pop)}
.celeb p{margin:6px auto;max-width:440px;font-size:17px}
.celeb .when{display:inline-block;margin:8px 0 14px;padding:4px 16px;border-radius:99px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);font-weight:700}
.celeb .tierchg{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--sun);color:#4A0F36;font-weight:800;margin:6px 0}

/* ---------- MERGE CINEMATIC ---------- */
.cine{position:fixed;inset:0;z-index:90;background:#04010a;overflow:hidden;opacity:0;transition:opacity 1s ease;color:#FFEAF5}
.cine.on{opacity:1}
.cine::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 78%,rgba(255,46,138,.28),transparent 70%),radial-gradient(60% 40% at 50% 0%,rgba(110,40,255,.25),transparent 70%)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}
.cine-skip{position:absolute;top:16px;right:16px;z-index:5;padding:8px 16px;border-radius:99px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-weight:700}
.cine-head{position:absolute;top:6%;left:0;right:0;z-index:4;text-align:center;padding:0 16px;pointer-events:none}
.cine-title{font:800 clamp(28px,7vw,58px)/1.1 var(--fh);text-shadow:0 0 30px var(--pop)}
.cine-cap{margin-top:8px;font-size:clamp(15px,3vw,22px);font-weight:600;min-height:30px;transition:opacity .3s}
.cine-stage{position:absolute;inset:0}
.cine-ground{position:absolute;left:0;right:0;bottom:calc(16% - 6px);height:3px;background:linear-gradient(90deg,transparent,var(--pop),transparent);opacity:.7}
.cine-ground::after{content:"";position:absolute;left:10%;right:10%;top:3px;height:80px;background:radial-gradient(50% 100% at 50% 0,rgba(255,46,138,.45),transparent 70%)}
.cc{position:absolute;bottom:16%;width:var(--cw);translate:-50% 0;transform:translateX(var(--from));transition:transform 1.9s cubic-bezier(.2,.85,.25,1)}
.cc.in{transform:none}
.cc-name{position:absolute;top:100%;left:50%;translate:-50% 0;margin-top:8px;width:max-content;max-width:calc(var(--cw)*1.7);text-align:center;line-height:1.2;overflow-wrap:anywhere;padding:2px 12px;border-radius:14px;background:var(--sun);color:#4A0F36;font:800 clamp(12px,2.2vw,16px) var(--fh);border:2px solid #2a0a20}
.cc-flame{position:absolute;left:50%;translate:-50% 0;bottom:100%;margin-bottom:6px;opacity:0;transition:opacity .5s}
.cc-flame.on{opacity:1}
.cine-target{position:absolute;left:50%;translate:-50% 0;bottom:calc(16% + 28px);width:var(--bw);height:calc(var(--bw)*1.3);pointer-events:none}
.bigflame{position:absolute;left:50%;translate:-50% 0;bottom:calc(16% + 12px);transform:scale(0);transform-origin:50% 100%;pointer-events:none}
.bigflame.show{animation:boom 1.3s cubic-bezier(.2,1.5,.35,1) forwards}
@keyframes boom{0%{transform:scale(0)}100%{transform:scale(1)}}
.cine-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 66%,#fff 0,#ffd0ea 22%,rgba(255,46,138,.5) 45%,transparent 72%);opacity:0;pointer-events:none;z-index:3}
.cine-flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.cine.shake .cine-stage{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.cine-end{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;opacity:0;transition:opacity .8s;z-index:5;padding:0 16px}
.cine-end.on{opacity:1}
.cine-end p{margin:0 0 10px;font-weight:600;font-size:clamp(14px,2.6vw,18px)}

/* ---------- bảng màu nền ---------- */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.pal{display:grid;gap:8px;padding:8px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);text-align:left;font-weight:700;font-size:14.5px}
.pal[aria-pressed=true]{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pop)}
.pal .pv{position:relative;display:block;height:62px;border-radius:12px;border:2px solid var(--line);overflow:hidden}
.pal .pv i{position:absolute;left:8px;right:34px;top:10px;bottom:10px;border-radius:9px;border:2px solid}
.pal .pv b{position:absolute;right:8px;top:12px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.hue{width:100%;height:16px;border-radius:99px;border:2.5px solid var(--line);appearance:none;-webkit-appearance:none;outline-offset:4px;
  background:linear-gradient(90deg,hsl(0 100% 60%),hsl(60 100% 55%),hsl(120 100% 45%),hsl(180 100% 45%),hsl(240 100% 65%),hsl(300 100% 60%),hsl(360 100% 60%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--line);cursor:pointer}
.hue::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--line);cursor:pointer}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

/* =========================================================
   TÍNH CHUỖI
   ========================================================= */
const daySet=u=>new Set(Object.keys(u.days));
function streakInfo(set,today){
  let cur=0,start=null,anchor=null;
  if(set.has(today))anchor=today;else if(set.has(addDays(today,-1)))anchor=addDays(today,-1);
  if(anchor){let k=anchor;while(set.has(k)){cur++;start=k;k=addDays(k,-1)}}
  const arr=[...set].sort();
  let best=0,run=0,prev=null;
  for(const k of arr){run=(prev&&addDays(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k}
  const last=arr[arr.length-1]||null;
  let prevRun=0;if(cur===0&&last){let k=last;while(set.has(k)){prevRun++;k=addDays(k,-1)}}
  const doneToday=set.has(today);
  return {cur,start,best,last,total:arr.length,doneToday,atRisk:cur>0&&!doneToday,lost:cur===0&&arr.length>0,prevRun};
}
const infoOf=u=>streakInfo(daySet(u),todayKey());
function runMap(u){ /* độ dài chuỗi tại từng ngày đã tập */
  const arr=Object.keys(u.days).sort(),m={};let prev=null,run=0;
  for(const k of arr){run=(prev&&addDays(prev,1)===k)?run+1:1;m[k]=run;prev=k}
  return m;
}
function squadInfo(sq){
  const ms=sq.members.map(U).filter(Boolean),t=todayKey();
  if(ms.length<2)return {...streakInfo(new Set(),t),doneCount:0,n:ms.length,ms};
  let common=new Set(Object.keys(ms[0].days));
  for(const m of ms.slice(1))common=new Set([...common].filter(k=>m.days[k]));
  const info=streakInfo(common,t);
  info.doneCount=ms.filter(m=>m.days[t]).length;info.n=ms.length;info.ms=ms;
  return info;
}

/* =========================================================
   HIỆU ỨNG (pháo giấy + tia lửa) — canvas toàn màn hình
   ========================================================= */
const fx={cv:null,ctx:null,ps:[],run:false,dpr:1,
  init(){this.cv=$("#fx");this.ctx=this.cv.getContext("2d");this.resize();addEventListener("resize",()=>this.resize())},
  resize(){this.dpr=Math.min(2,devicePixelRatio||1);this.cv.width=innerWidth*this.dpr;this.cv.height=innerHeight*this.dpr},
  add(p){this.ps.push(p);if(!this.run){this.run=true;requestAnimationFrame(()=>this.tick())}},
  burst(x,y,o={}){
    const n=o.n||70,cols=o.colors||["#FF2E8A","#FFD23F","#2FD8A8","#A97BFF","#38C7FF","#FF8A1F","#ffffff"];
    for(let i=0;i<n;i++){
      const a=o.up?(-Math.PI/2+rnd(-.9,.9)):rnd(0,Math.PI*2),sp=rnd(2,o.speed||11);
      this.add({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.g??.28,r:rnd(3,7),c:cols[(Math.random()*cols.length)|0],life:0,max:rnd(70,130),rot:rnd(0,6),vr:rnd(-.3,.3),shape:o.shape||(Math.random()<.5?"rect":"circ")});
    }
  },
  rain(n=120){
    for(let i=0;i<n;i++)setTimeout(()=>this.add({x:rnd(0,innerWidth),y:-10,vx:rnd(-1.5,1.5),vy:rnd(2,5),g:.05,r:rnd(4,8),c:["#FF2E8A","#FFD23F","#2FD8A8","#A97BFF","#38C7FF","#FF8A1F","#fff"][(Math.random()*7)|0],life:0,max:rnd(180,280),rot:rnd(0,6),vr:rnd(-.2,.2),shape:"rect"}),i*14);
  },
  tick(){
    const c=this.ctx,d=this.dpr;c.clearRect(0,0,this.cv.width,this.cv.height);
    this.ps=this.ps.filter(p=>{
      p.life++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.rot+=p.vr;
      if(p.life>p.max||p.y>innerHeight+30)return false;
      c.save();c.globalAlpha=Math.max(0,Math.min(1,(p.max-p.life)/30));c.translate(p.x*d,p.y*d);c.rotate(p.rot);c.fillStyle=p.c;
      if(p.shape==="rect")c.fillRect(-p.r*d,-p.r*.6*d,p.r*2*d,p.r*1.2*d);
      else{c.beginPath();c.arc(0,0,p.r*d*.7,0,7);c.fill()}
      c.restore();return true;
    });
    if(this.ps.length)requestAnimationFrame(()=>this.tick());else{this.run=false;c.clearRect(0,0,this.cv.width,this.cv.height)}
  }
};

function toast(msg,ms=3200){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .4s";t.style.opacity="0";setTimeout(()=>t.remove(),400)},ms);
}
function openModal(html){
  const m=$("#modal");m.innerHTML=`<div class="sheet" id="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden=false;requestAnimationFrame(()=>m.classList.add("on"));
  setTimeout(()=>{const f=$("#sheet input[type=text]");f&&f.focus()},120);
  return $("#sheet");
}
function closeModal(){const m=$("#modal");m.classList.remove("on");setTimeout(()=>{if(!m.classList.contains("on")){m.hidden=true;m.innerHTML=""}},250)}
function askConfirm(text,okLabel="Đồng ý"){

    openModal(`<h3>Bạn chắc chứ?</h3><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec sm" id="cNo">Huỷ</button><button class="btn sm" id="cYes">${esc(okLabel)}</button></div>`);

  });
}

/* Hàng đợi: để mốc cá nhân và cảnh gộp lửa lần lượt hiện ra */
const Q=[];let busy=false;
function enqueue(fn){Q.push(fn);pump()}
async function pump(){if(busy)return;busy=true;while(Q.length){const f=Q.shift();try{await f()}catch(e){console.error(e)}}busy=false}

   ========================================================= */
function pushFeed(o){S.feed.unshift({id:uid(),date:todayKey(),ts:Date.now(),read:false,...o});S.feed=S.feed.slice(0,150)}
const isNew=f=>f.to&&f.to===S.activeId&&(SH?f.ts>(S.lastSeen||0):!f.read);
function unreadCount(){return S.feed.filter(isNew).length}
function interact(type,toId,text){
  const m=me(),t=U(toId);if(!m||!t||m.id===t.id||!canWrite())return;
  const d=todayKey();
  if(type!=="msg"&&S.feed.some(f=>f.type===type&&f.from===m.id&&f.to===toId&&f.date===d)){toast(type==="cheer"?"Hôm nay bạn đã thả lửa cho bạn ấy rồi 🔥":"Bạn đã nhắc bạn ấy hôm nay rồi nha 👋");return}
  pushFeed({type,from:m.id,to:toId,text});save();render();
  fx.burst(innerWidth/2,innerHeight*.7,{n:26,up:true,speed:9});
  toast(type==="cheer"?`Đã thả lửa cổ vũ ${t.name} 🔥`:type==="nudge"?`Đã nhắc ${t.name} đi tập 👋`:`Đã gửi lời chúc tới ${t.name} 💌`);
}

  const t=todayKey();
  if(u.days[t]){toast("Hôm nay bạn đã giữ lửa rồi 🔥");return}
  u.days[t]=focusFor(t).t;
  pushFeed({type:"checkin",from:u.id});save();render();
  const b=$('[data-act="checkin"]');const r=b?b.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  fx.burst(r.left+r.width/2,r.top,{n:60,up:true,speed:12});
  const info=infoOf(u);
  toast(HYPE[(info.cur+ui.bseed)%HYPE.length].replace("{n}",info.cur));
  checkMilestones(u);checkMerges(sq=>sq.members.includes(u.id));
}
function checkMilestones(u){
  const info=infoOf(u);
  if(info.cur>0&&info.doneToday&&isMilestone(info.cur)){
    const key=`${info.start}#${info.cur}`;u.celebrated=u.celebrated||[];
    if(!u.celebrated.includes(key)){u.celebrated.push(key);pushFeed({type:"milestone",from:u.id,n:info.cur});save();enqueue(()=>celebrate(u,info.cur))}
  }
}
function checkMerges(byUser){
  const t=todayKey();let ch=false;
  for(const sq of S.squads){
    if(SH&&!sq.members.includes(SH.uid))continue;
    const i=squadInfo(sq);if(i.n<2||!i.cur)continue;
    const k=Math.floor(i.cur/30),key=sq.id+"#"+i.start,fresh=k>0&&i.cur%30===0&&i.last===t;
    if(S.seenMerge[key]===undefined){S.seenMerge[key]=fresh?k-1:k;ch=true}
    if(k>S.seenMerge[key]){
      S.seenMerge[key]=k;ch=true;
      if(byUser&&!S.feed.some(f=>f.key===key+"#"+k)){pushFeed({type:"merge",from:S.activeId||sq.members[0],sq:sq.name,n:i.cur,key:key+"#"+k})}
      enqueue(()=>playMerge(sq,{}));
    }
  }
  if(ch)byUser?save():(SH?savePrefs():save());
}

/* Hộp chúc mừng mốc cá nhân */
function celebrate(u,n){
  return new Promise(res=>{
    const tier=tierFor(n),[title,msg]=mileText(n),isTier=TIERS.some(t=>t.min===n&&n>0);
    const el=$("#celeb");
    el.innerHTML=`<div class="box">${flame(n,{tier,fs:230,sparks:true})}<h2>${esc(title)}</h2>
      <div class="when">${esc(u.name)} • ${wdOf(todayKey())}, ${vn(todayKey())}</div>
      <p>${esc(msg)}</p>${isTier?`<div class="tierchg">✨ Lửa đổi màu: ${esc(tier.name)}</div>`:""}
      <div style="margin-top:14px"><button class="btn sun big" id="celeBtn">Tuyệt vời!</button></div></div>`;

/* =========================================================
   CẢNH GỘP LỬA — chibi chạy ra, truyền lửa, gộp thành ngọn lớn
   (luôn nền tối, kể cả đang ban ngày)
   ========================================================= */
let cineClose=null;
function playMerge(sq,{preview=false}={}){
  return new Promise(res=>{
    const ms=sq.members.map(U).filter(Boolean).slice(0,6),n=ms.length;
    if(n<2){res();return}
    const info=squadInfo(sq);
    const cur=preview?Math.max(info.cur,30):info.cur,months=Math.max(1,Math.floor(cur/30));
    const el=$("#cine"),stage=$("#cineStage"),timers=[];
    const T=(ms_,fn)=>timers.push(setTimeout(fn,ms_));
    const cap=t=>{const c=$("#cineCap");c.style.opacity=0;setTimeout(()=>{c.textContent=t;c.style.opacity=1},180)};
    const cw=Math.max(62,Math.min(n<=2?150:n<=3?128:n<=4?108:92,innerWidth/(n+1.6),innerHeight*.24));
    const bw=Math.round(Math.min(320,innerHeight*.38,innerWidth*.5));
    const spacing=Math.min(innerWidth<600?44:34,64/(n-1));
    el.style.setProperty("--bw",bw+"px");
    $("#cineStars").innerHTML=Array.from({length:70},()=>`<i style="left:${rnd(0,100)}%;top:${rnd(0,92)}%;animation-delay:${rnd(0,3).toFixed(2)}s;transform:scale(${rnd(.5,1.4).toFixed(2)})"></i>`).join("");
    stage.innerHTML=`<div class="cine-ground"></div><div class="cine-target"></div>
      <div class="bigflame">${flame(cur,{tier:tierFor(cur),fs:bw,sparks:true})}</div>`+
      ms.map((m,i)=>{
        const x=50+(i-(n-1)/2)*spacing,side=i<n/2?-1:1,pc=infoOf(m).cur;
        return `<div class="cc" style="left:${x}%;--cw:${cw}px;--from:${side*72}vw">
          <div class="cc-flame">${flame(pc,{fs:Math.round(cw*.62),num:false,tier:tierFor(Math.max(pc,1))})}</div>
          ${chibi(m.chibi,{pose:"run",w:cw})}<div class="cc-name">${esc(m.chibi.name||m.name)}</div></div>`}).join("");
    $("#cineTitle").textContent=preview?"Xem trước gộp lửa":`Mốc ${months} tháng rồi!`;
    $("#cineCap").textContent="Các chiến binh lửa đang chạy tới…";
    $("#cineEnd").classList.remove("on");$("#cineFlash").classList.remove("go");el.classList.remove("shake");
    el.hidden=false;document.documentElement.dataset.cine="1";
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));

    T(900,()=>$$(".cc",stage).forEach((c,i)=>setTimeout(()=>c.classList.add("in"),i*220)));
    T(3100,()=>{$$(".chibi",stage).forEach(c=>{c.classList.remove("run");c.classList.add("cast")});$$(".cc-flame",stage).forEach(f=>f.classList.add("on"));cap("Cùng nhau truyền lửa nào! 🔥")});
    T(4300,()=>{
      cap("Gộp lại thành một…");
      const tg=$(".cine-target",stage).getBoundingClientRect(),tx=tg.left+tg.width/2,ty=tg.top+tg.height*.55;
      $$(".cc-flame",stage).forEach((f,i)=>{
        const r=f.getBoundingClientRect(),dx=tx-(r.left+r.width/2),dy=ty-(r.top+r.height/2);
        f.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-70}px) scale(1.15)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.25)`,opacity:0}],{duration:1500,delay:i*80,easing:"cubic-bezier(.45,0,.75,.35)",fill:"forwards"});
        const iv=setInterval(()=>{const q=f.getBoundingClientRect();fx.burst(q.left+q.width/2,q.top+q.height/2,{n:3,speed:3,g:-.02,colors:["#FFD23F","#FF86BE","#fff"],shape:"circ"})},90);
        setTimeout(()=>clearInterval(iv),1600+i*80);
      });
    });
    T(6200,()=>{
      $("#cineFlash").classList.add("go");el.classList.add("shake");
      $(".bigflame",stage).classList.add("show");
      const tg=$(".cine-target",stage).getBoundingClientRect();
      fx.burst(tg.left+tg.width/2,tg.top+tg.height*.6,{n:150,speed:16,colors:["#FF2E8A","#FFD23F","#FF86BE","#fff","#A97BFF"]});
      cap(`Ngọn lửa chung ${cur} ngày bùng cháy! 🔥🔥🔥`);
    });
    T(7000,()=>{$$(".chibi",stage).forEach(c=>{c.classList.remove("cast");c.classList.add("jump")});fx.rain(140)});
    T(8800,()=>{
      cap(preview?`${sq.name} • ${n} chiến binh lửa`:`${sq.name}: ${n} người cùng giữ lửa ${cur} ngày • ${wdOf(todayKey())}, ${vn(todayKey())}`);
      $("#cineEnd").classList.add("on");
    });

    cineClose=()=>{
      timers.forEach(clearTimeout);cineClose=null;
      el.classList.remove("on");
      setTimeout(()=>{el.hidden=true;stage.innerHTML="";delete document.documentElement.dataset.cine;res()},900);
    };
  });
}

const PALS=[
 {id:"pink",  name:"Hồng kẹo",     h:335},
 {id:"cherry",name:"Đỏ cherry",    h:354},
 {id:"peach", name:"Cam đào",      h:18},

 {id:"lilac", name:"Tím oải hương",h:268}
];
function palVars(h,mode){
  const h2=(h+60)%360,h3=(h+300)%360,light=h>=35&&h<200; /* tông vàng/lục/lam: nút sáng, chữ tối */
  if(mode==="night"){
    const pop=`hsl(${h} 100% ${light?55:62}%)`;
    return {"--bg":`hsl(${h} 70% 3%)`,"--card":`hsl(${h} 55% 8%)`,"--card2":`hsl(${h} 48% 12%)`,"--ink":`hsl(${h} 100% 96%)`,"--ink2":`hsl(${h} 35% 74%)`,
      "--line":`hsl(${h} 100% 64%)`,"--pop":pop,"--pop2":`hsl(${h} 100% 76%)`,"--sh":`hsl(${h} 80% 22%)`,"--glow":`hsl(${h} 100% 62% / .38)`,"--dot":`hsl(${h} 100% 65% / .09)`,
      "--blob1":`hsl(${h} 100% 55% / .22)`,"--blob2":`hsl(${h2} 100% 60% / .20)`,"--blob3":`hsl(${h3} 100% 55% / .10)`,"--onpop":light?`hsl(${h} 80% 8%)`:"#fff"};
  }
  return {"--bg":`hsl(${h} 100% 92%)`,"--card":`hsl(${h} 100% 98%)`,"--card2":`hsl(${h} 100% 95%)`,"--ink":`hsl(${h} 66% 17%)`,"--ink2":`hsl(${h} 32% 40%)`,
    "--line":`hsl(${h} 66% 17%)`,"--pop":`hsl(${h} 100% ${light?52:58}%)`,"--pop2":`hsl(${h} 100% 76%)`,"--sh":`hsl(${h} 100% ${light?40:58}%)`,"--glow":`hsl(${h} 100% 58% / 0)`,"--dot":`hsl(${h} 100% 58% / .16)`,
    "--blob1":`hsl(${h} 100% 75% / .65)`,"--blob2":`hsl(${h2} 100% 76% / .45)`,"--blob3":`hsl(${h3} 100% 72% / .42)`,"--onpop":light?`hsl(${h} 66% 12%)`:"#fff"};
}
function applyPalette(){
  const p=S.palette||{id:"pink",h:335};
  let st=$("#palStyle");if(!st){st=document.createElement("style");st.id="palStyle";document.head.appendChild(st)}
  const css=o=>Object.entries(o).map(([k,v])=>`${k}:${v}`).join(";");
  /* Cảnh gộp lửa (data-cine) luôn dùng bản đêm của bảng màu đang chọn */
  st.textContent=p.id==="pink"?"":`html[data-theme=day]:not([data-cine]){${css(palVars(p.h,"day"))}}\nhtml[data-theme=night],html[data-cine]{${css(palVars(p.h,"night"))}}`;
}
function openPalette(){
  const mode=S.theme==="night"?"night":"day",cur=S.palette||{id:"pink",h:335};
  const card=(id,name,h)=>{const v=palVars(h,mode);
    return `<button type="button" class="pal" data-pid="${id}" data-h="${h}" aria-pressed="${cur.id===id}"><span class="pv" style="background:${v["--bg"]}"><i style="background:${v["--card"]};border-color:${v["--line"]}"></i><b style="background:${v["--pop"]}"></b></span>${esc(name)}</button>`};
  const sh=openModal(`<h3>Bảng màu nền</h3>
   <p class="small muted" style="margin-top:-6px">Chọn một bảng màu có sẵn, hoặc kéo thanh bên dưới để tự pha tông màu riêng. Áp dụng cho cả chế độ ngày và đêm.</p>
   <div class="pals">${PALS.map(p=>card(p.id,p.name,p.h)).join("")}</div>
   <div class="field"><label for="palH">Tự chọn tông màu</label><input class="hue" type="range" id="palH" min="0" max="360" value="${cur.h}"></div>
   <div class="row" style="justify-content:space-between"><button class="btn sec sm" id="palReset">Về hồng kẹo</button><button class="btn" data-act="close">Xong</button></div>`);
  const mark=id=>$$(".pal",sh).forEach(b=>b.setAttribute("aria-pressed",b.dataset.pid===id));
  const set=(id,h)=>{S.palette={id,h:Number(h)};save();applyPalette();applyTheme();mark(id)};
  $$(".pal",sh).forEach(b=>b.onclick=()=>{$("#palH",sh).value=b.dataset.h;set(b.dataset.pid,b.dataset.h)});

/* ---------- Tab: Lửa của tôi ---------- */
function bannerFor(u,info){
  const pick=a=>a[ui.bseed%a.length];
  if(!info.total)return {cls:"",txt:"Hôm nay là ngày 1. Châm ngọn lửa đầu tiên nào! 🔥"};
  if(info.lost)return {cls:"",txt:`Chuỗi ${info.prevRun} ngày đã tắt sau ngày ${vn(info.last)}. ${pick(LOST)}`};
  if(info.atRisk){
    let extra="";if(!S.dayOffset){const h=24-new Date().getHours();if(h<=6)extra=` Còn khoảng ${h} giờ nữa là hết ngày.`}
    return {cls:"warn",txt:pick(RISK)+extra};
  }
  return {cls:"ok",txt:pick(HYPE).replace("{n}",info.cur)};
}

/* ---------- Lịch ---------- */
function calHTML(u,mode){
  const t=todayKey(),tp=parseKey(t);
  const v=ui.cal[u.id]||(ui.cal[u.id]={y:tp.getFullYear(),m:tp.getMonth()});
  const first=new Date(v.y,v.m,1),lead=(first.getDay()+6)%7,dim=new Date(v.y,v.m+1,0).getDate();
  const rm=runMap(u);
  let cells=["T2","T3","T4","T5","T6","T7","CN"].map(w=>`<div class="cal-w">${w}</div>`).join("");
  for(let i=0;i<lead;i++)cells+=`<div class="cd out"></div>`;

  const t=U(toId);
  const sh=openModal(`<h3>Gửi lời chúc cho ${esc(t.name)}</h3><div class="row" style="margin-bottom:12px">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
   <div class="field"><label for="mTxt">Hoặc tự viết</label><input type="text" id="mTxt" maxlength="80" placeholder="Viết gì đó thật tiếp lửa…"></div>
   <div class="row" style="justify-content:flex-end"><button class="btn sec sm" data-act="close">Huỷ</button><button class="btn" id="mSend">Gửi</button></div>`);
  const send=txt=>{txt=(txt||"").trim();if(!txt){toast("Hãy chọn hoặc viết một lời chúc nhé");return}closeModal();interact("msg",toId,txt)};
  $$("[data-q]",sh).forEach(b=>b.onclick=()=>send(b.dataset.q));
  $("#mSend",sh).onclick=()=>send($("#mTxt",sh).value);
}
function openExport(){
  const sh=openModal(`<h3>Xuất / Nhập dữ liệu</h3>
   <p class="small muted">Dữ liệu được lưu ngay trên trình duyệt này. Muốn xem chuỗi của nhau trên máy khác: bấm “Chép dữ liệu”, gửi đoạn mã cho bạn, rồi bạn dán vào ô bên dưới và bấm “Nhập & gộp”. Dữ liệu cùng người sẽ được hợp nhất, không bị mất.</p>
   <div class="field"><label for="exData">Dữ liệu</label><textarea id="exData" spellcheck="false"></textarea></div>
   <div class="row"><button class="btn sm sec" id="exCopy">Chép dữ liệu</button><button class="btn sm" id="exImp">Nhập & gộp</button><button class="btn sm sec" data-act="close">Đóng</button></div>`);
  const ta=$("#exData",sh);ta.value=JSON.stringify({users:S.users,squads:S.squads,feed:S.feed.slice(0,60)});
  $("#exCopy",sh).onclick=()=>{ta.value=JSON.stringify({users:S.users,squads:S.squads,feed:S.feed.slice(0,60)});ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Đã chép vào bộ nhớ tạm 📋":"Hãy chọn toàn bộ ô và sao chép thủ công nhé")};
  $("#exImp",sh).onclick=()=>{
    try{
      const inc=JSON.parse(ta.value);if(!inc||!Array.isArray(inc.users))throw 0;
      for(const iu of inc.users){const cu=U(iu.id);
        if(!cu)S.users.push(iu);
        else{Object.assign(cu.days,iu.days||{});cu.celebrated=[...new Set([...(cu.celebrated||[]),...(iu.celebrated||[])])];if(!cu.created||iu.created<cu.created)cu.created=iu.created}}
      for(const sq of inc.squads||[])if(!S.squads.some(s=>s.id===sq.id))S.squads.push(sq);
      for(const f of inc.feed||[])if(!S.feed.some(x=>x.id===f.id))S.feed.push(f);
      S.feed.sort((a,b)=>b.ts-a.ts);save();closeModal();render();toast("Đã nhập và gộp dữ liệu 🎉");
    }catch(e){toast("Dữ liệu chưa đúng định dạng, kiểm tra lại giúp mình nhé")}
  };
}

/* =========================================================
   SỰ KIỆN
   ========================================================= */
const H={
  theme(){S.theme=S.theme==="night"?"day":"night";save();applyTheme()},
  palette(){openPalette()},
  bell(){ui.tab="feed";render()},
  tab(b){ui.tab=b.dataset.tab;render()},
  user(b){S.activeId=b.dataset.id;save();render();const n=unreadCount();if(n)toast(`Bạn có ${n} tương tác mới 💌`)},
  newuser(){openUserModal()},
  edituser(b){openUserModal(b.dataset.id)},
  checkin,
  newmsg(){ui.bseed++;render()},
  calnav(b){const v=ui.cal[b.dataset.uid];let m=v.m+Number(b.dataset.d),y=v.y;if(m<0){m=11;y--}if(m>11){m=0;y++}v.m=m;v.y=y;refreshCal(b.dataset.uid)},
  calday(b){
    const u=U(b.dataset.uid),k=b.dataset.k,rm=runMap(u),box=$(`[data-detail="${u.id}"]`);
    box.innerHTML=u.days[k]?`<b>${wdOf(k)}, ${vn(k)}</b> · đã tập: ${esc(u.days[k])} · chuỗi ngày thứ <b>${rm[k]}</b> 🔥`:`<b>${wdOf(k)}, ${vn(k)}</b> · ${k>todayKey()?"chưa tới ngày này":"chưa có buổi tập"}`;
  },
  cheer(b){closeModal();interact("cheer",b.dataset.to)},
  nudge(b){interact("nudge",b.dataset.to)},
  msg(b){openMsgModal(b.dataset.to)},
  viewcal(b){openViewModal(b.dataset.uid)},
  newsq(){openSquadModal()},
  async delsq(b){const s=S.squads.find(x=>x.id===b.dataset.id);if(!await askConfirm(`Giải tán hội “${s.name}”?`,"Giải tán"))return;S.squads=S.squads.filter(x=>x!==s);save();render()},
  playsq(b){const s=S.squads.find(x=>x.id===b.dataset.id);enqueue(()=>playMerge(s,{preview:true}))},
  exg(b){ui.exG=b.dataset.g;render()},
  exd(b){ui.exD=Number(b.dataset.d);render()},
  close(){closeModal()},
  cineskip(){if(cineClose)cineClose()},
  plus1(){S.dayOffset=(S.dayOffset||0)+1;save();render();toast(`Đã tua sang ${wdOf(todayKey())}, ${vn(todayKey())}`)},
  resetday(){S.dayOffset=0;save();render()},
  demo(){seedDemo()},
  allcheck(){
    const t=todayKey();
    S.users.forEach(u=>{if(!u.days[t]){u.days[t]=focusFor(t).t;pushFeed({type:"checkin",from:u.id})}});
    save();render();S.users.forEach(checkMilestones);checkMerges(()=>true);toast("Cả nhóm đã điểm danh hôm nay 🔥");
  },
  export(){openExport()},
  async wipe(){if(!await askConfirm("Xoá toàn bộ người tập, hội và lịch sử trên trình duyệt này?","Xoá hết"))return;S={users:[],squads:[],feed:[],activeId:null,theme:S.theme,dayOffset:0};save();ui.tab="me";render()}
};
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){closeModal();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const f=H[b.dataset.act];if(f)f(b,e);
});
document.addEventListener("toggle",e=>{if(e.target.id==="tools")ui.toolsOpen=e.target.open},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(cineClose){cineClose();return}if(!$("#modal").hidden)closeModal()}
});

/* =========================================================
   ĐỒNG BỘ NHIỀU MÁY (db của trang xuất bản): players/{id}, events/{id}, squads/{id}
   ========================================================= */
function put(path,obj){
  const j=JSON.stringify(obj);if(SH.last[path]===j)return;SH.last[path]=j;SH.pending++;
  SH.q[path]=(SH.q[path]||Promise.resolve()).then(()=>SH.db.doc(path).set(JSON.parse(j))).catch(e=>{delete SH.last[path];werr(e)}).finally(()=>SH.pending--);
}
function del(path){delete SH.last[path];SH.pending++;SH.db.doc(path).delete().catch(werr).finally(()=>SH.pending--)}
function werr(e){if(e&&e.code==="invalid_argument"){SH.rw=false;toast("Tài khoản này chỉ xem được. Hãy nhờ chủ trang mời bạn quyền chỉnh sửa nhé.",6000)}else toast("Chưa lưu được lên máy chủ, thử lại sau nhé")}
function syncOut(){
  if(!SH||!SH.rw)return;
  const clean=o=>{const c={...o};delete c.id;return c},mine=U(SH.uid);
  if(mine)put("players/"+SH.uid,clean(mine));else if(SH.last["players/"+SH.uid])del("players/"+SH.uid);
  put("events/"+SH.uid,{items:S.feed.filter(f=>f.from===SH.uid).slice(0,50)});
  S.squads.forEach(q=>put("squads/"+q.id,clean(q)));
  Object.keys(SH.last).forEach(k=>{if(k.startsWith("squads/")&&!S.squads.some(q=>"squads/"+q.id===k))del(k)});
}
async function initShared(){
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  SH={db,uid:id,rw:(await user.can("data.write"))!==false,last:{},q:{},pending:0,got:{},t:0};
  KEY="giulua.sh1";const p=store.load()||{};
  S={users:[],squads:[],feed:[],activeId:id,theme:p.theme||S.theme,dayOffset:0,palette:p.palette||S.palette,seenMerge:p.seenMerge||{},lastSeen:p.lastSeen||Date.now()};
  const wake=()=>{clearTimeout(SH.t);SH.t=setTimeout(()=>{S.activeId=id;ui.boot=false;render();if(SH.got.players&&SH.got.squads&&SH.got.events)checkMerges(false)},150)};
  const keep=(col,key)=>q=>{ /* giữ nguyên đối tượng cũ nếu không đổi, để hộp thoại đang mở không bị lệch */
    const old=S[col];S[col]=q.docs.map(d=>{const path=key+"/"+d.id,j=JSON.stringify(d.data()),o=old.find(x=>x.id===d.id);
      if(o&&(SH.last[path]===j||(d.id===id&&key==="players"&&SH.pending)))return o;SH.last[path]=j;return {...JSON.parse(j),id:d.id}})};
  const sub=(name,fn)=>db.collection(name).onSnapshot(q=>{fn(q);if(!q.metadata.fromCache)SH.got[name]=1;wake()},()=>toast("Mất kết nối chia sẻ, hãy tải lại trang nhé"));
  sub("players",keep("users","players"));sub("squads",keep("squads","squads"));
  sub("events",q=>{q.docs.forEach(d=>{SH.last["events/"+d.id]=JSON.stringify(d.data())});S.feed=q.docs.flatMap(d=>JSON.parse(JSON.stringify(d.data().items||[]))).sort((a,b)=>b.ts-a.ts).slice(0,150)});
}

/* =========================================================
   KHỞI ĐỘNG

S.users.forEach(u=>{u.days=u.days||{};u.celebrated=u.celebrated||[];u.chibi=u.chibi||{name:u.name,hair:"#2B1B17",shirt:"#FF2E8A",pants:"#4A0F36"};u.chibi.style=u.chibi.style||(u.gender==="male"?"male":"female")});
S.palette=S.palette||{id:"pink",h:335};
fx.init();
ui.boot=!!(window.claude&&window.claude.use);
render();
if(ui.boot){initShared().catch(()=>{}).finally(()=>{if(!SH){ui.boot=false;render()}});setTimeout(()=>{if(ui.boot){ui.boot=false;render()}},8000)}
